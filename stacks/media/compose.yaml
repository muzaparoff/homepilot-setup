# HomePilot media module — opt-in, enabled with: ./setup.sh --with-media
#
# Ports match HomePilot's defaults. Note qBittorrent on 8081, not the
# linuxserver image's usual 8080: HomePilot defaults to 8081, and 8080
# collides with almost everything else on a homelab box.
#
# The *arr API keys are injected here, before first boot, rather than
# generated by the apps and read back afterwards. That inversion is what
# makes setup re-runnable and lets the wiring step know every key up front
# without parsing a config file that may not exist yet.

name: homepilot-media

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.4
    container_name: homepilot-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8081
    volumes:
      - ${HOMEPILOT_DATA:-./data}/qbittorrent:/config
      # Single mount, so Sonarr/Radarr imports hardlink instead of copying.
      - ${MEDIA_ROOT:-./data/media}:/data
    ports:
      - "${QBITTORRENT_PORT:-8081}:8081"
      - "6881:6881"
      - "6881:6881/udp"
    networks: [homepilot]

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: homepilot-sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-UTC}
      # Overrides config.xml. Documented in the Servarr wiki; the same
      # mechanism Recyclarr uses in its own CI compose file.
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY:?run ./setup.sh to generate}
      - SONARR__AUTH__METHOD=Forms
      - SONARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - ${HOMEPILOT_DATA:-./data}/sonarr:/config
      - ${MEDIA_ROOT:-./data/media}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"
    depends_on: [qbittorrent]
    networks: [homepilot]

  radarr:
    image: lscr.io/linuxserver/radarr:5.15.1
    container_name: homepilot-radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-UTC}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY:?run ./setup.sh to generate}
      - RADARR__AUTH__METHOD=Forms
      - RADARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - ${HOMEPILOT_DATA:-./data}/radarr:/config
      - ${MEDIA_ROOT:-./data/media}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"
    depends_on: [qbittorrent]
    networks: [homepilot]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.28.2
    container_name: homepilot-prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-UTC}
      - PROWLARR__AUTH__APIKEY=${PROWLARR_API_KEY:?run ./setup.sh to generate}
      - PROWLARR__AUTH__METHOD=Forms
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
    volumes:
      - ${HOMEPILOT_DATA:-./data}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    networks: [homepilot]

networks:
  homepilot:
    name: homepilot
    external: true
