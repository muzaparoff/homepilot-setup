# HomePilot core stack — container management and metrics.
#
# Ports match HomePilot's built-in defaults, so the app connects with no
# port editing. Relative paths resolve from the repo root: setup.sh always
# passes --project-directory.

name: homepilot-core

services:
  # Container manager. HomePilot's Stacks tab speaks to this over Socket.IO.
  dockge:
    image: louislam/dockge:1
    container_name: homepilot-dockge
    restart: unless-stopped
    ports:
      - "${DOCKGE_PORT:-5001}:5001"
    volumes:
      # Engine-dependent: /var/run/docker.sock for Docker Desktop, OrbStack
      # and Colima; /run/podman/podman.sock for Podman. setup.sh writes the
      # right one into .env after asking the server which engine it is.
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${HOMEPILOT_DATA:-./data}/dockge:/app/data
      - ${HOMEPILOT_DATA:-./data}/stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
    networks: [homepilot]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: homepilot-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    networks: [homepilot]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: homepilot-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run ./setup.sh to generate}
      - GF_USERS_ALLOW_SIGN_UP=false
      # HomePilot opens dashboards inside a WKWebView, which Grafana refuses
      # to render unless embedding is allowed.
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [homepilot]

  # Host CPU, memory and filesystem. On macOS this reports the container
  # VM rather than macOS itself — see README, "What the metrics mean".
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: homepilot-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/containers|var/lib/docker)($$|/)
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks: [homepilot]

  # Per-container state. Feeds HomePilot's Containers KPI card.
  #
  # This replaces cAdvisor deliberately. cAdvisor reads cgroups, and under
  # rootless Podman the container cgroups sit in a user slice it cannot
  # enumerate — measured on Podman Engine 5.7, it emits a single `id="/"`
  # series and no per-container data at all. Querying the Docker-compatible
  # HTTP API instead behaves identically on every engine.
  container-exporter:
    build: ./exporter
    image: homepilot/container-exporter:1
    container_name: homepilot-container-exporter
    restart: unless-stopped
    environment:
      - CONTAINER_SOCK=/var/run/docker.sock
      - EXPORTER_PORT=9101
    volumes:
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    ports:
      - "${EXPORTER_PORT:-9101}:9101"
    networks: [homepilot]

networks:
  homepilot:
    name: homepilot

volumes:
  prometheus_data:
  grafana_data:
